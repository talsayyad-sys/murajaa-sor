name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Murajaa-SOR.apk

      - uses: actions/upload-artifact@v4
        with:
          name: Murajaa-SOR-apk
          path: Murajaa-SOR.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest Murajaa-SOR.apk \
            --title "Murajaa SOR (APK)" \
            --notes "Pobierz plik Murajaa-SOR.apk i zainstaluj na telefonie z Androidem." \
            --target "${{ github.sha }}"
