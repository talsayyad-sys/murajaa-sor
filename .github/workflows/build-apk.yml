name: Zbuduj APK

on:
  push:
    branches: [ kieszonkowy ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Budowanie APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk SOR-Kieszonkowy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: SOR-Kieszonkowy-apk
          path: SOR-Kieszonkowy.apk

      - name: Publikacja w Releases
        uses: softprops/action-gh-release@v2
        with:
          target_commitish: ${{ github.sha }}
          tag_name: v1.${{ github.run_number }}
          name: SOR Kieszonkowy 1.${{ github.run_number }}
          body: Pobierz plik SOR-Kieszonkowy.apk na telefonie i zainstaluj.
          files: SOR-Kieszonkowy.apk
