<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;-webkit-tap-highlight-color:transparent}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>SOR Kieszonkowy</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: aplikacja jednoekranowa — nagłówek (masa ciała + wyszukiwarka), treść modułu z segmentami, dolny pasek 5 zakładek */
:root{
  --bg:#f3f5f6; --surface:#ffffff; --fg:#13202a; --muted:#5b6b76; --line:#d9e0e4;
  --accent:#0b6e79; --accent-soft:#dff0f1; --crit:#c2362b; --crit-soft:#fbe6e3; --warn:#a86a00; --warn-soft:#fdf1d8; --ok:#2c7a43; --ok-soft:#e1f2e6;
  --f-display:"Archivo",system-ui,sans-serif; --f-body:"IBM Plex Sans",system-ui,sans-serif; --f-mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e1519; --surface:#162127; --fg:#e4ecef; --muted:#93a4ad; --line:#26353d;
  --accent:#4cc3cf; --accent-soft:#163a3f; --crit:#ff7a6e; --crit-soft:#3d1f1c; --warn:#f0b54a; --warn-soft:#3a2d12; --ok:#6fd08c; --ok-soft:#173222; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1519; --surface:#162127; --fg:#e4ecef; --muted:#93a4ad; --line:#26353d;
  --accent:#4cc3cf; --accent-soft:#163a3f; --crit:#ff7a6e; --crit-soft:#3d1f1c; --warn:#f0b54a; --warn-soft:#3a2d12; --ok:#6fd08c; --ok-soft:#173222; color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.5 var(--f-body)}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.brand{display:flex;justify-content:space-between;align-items:center;gap:8px}
h1{font:800 20px/1.1 var(--f-display);margin:0;letter-spacing:-.01em}
h1 span{color:var(--crit)}
.iconbtn{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:10px;padding:6px 10px;display:flex;align-items:center;gap:6px;font:500 13px var(--f-body);cursor:pointer}
.iconbtn svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2}
.tag{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.wt{display:flex;gap:8px;align-items:center;margin-top:8px;flex-wrap:wrap}
.wt label{font-size:13px;color:var(--muted)}
.wt input{width:84px;font:600 18px var(--f-mono);padding:5px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:999px;padding:3px 10px;font:500 13px var(--f-mono);cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#sbox{margin-top:8px}
#sres{display:flex;flex-direction:column;max-height:50vh;overflow-y:auto;background:var(--surface);border:1px solid var(--line);border-radius:10px;margin-top:6px}
#sres:empty{display:none}
#sres button{text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:9px 12px;color:var(--fg);font:600 14px var(--f-body);cursor:pointer}
#sres button:first-child{border-top:0}
#sres button small{display:block;font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
main{padding:14px 16px 100px;max-width:760px;margin:0 auto}
h2{font:700 17px/1.2 var(--f-display);margin:20px 0 8px;text-wrap:balance}
.sub{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.08em;color:var(--accent);margin:18px 0 6px}
.list{background:var(--surface);border:1px solid var(--line);border-radius:12px;overflow:hidden}
.row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;padding:10px 12px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row .n{font-weight:600;min-width:0}
.row .d{font:600 15px var(--f-mono);text-align:right;font-variant-numeric:tabular-nums;color:var(--accent);max-width:52vw}
.row .m{grid-column:1/-1;font-size:13px;color:var(--muted)}
.search{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:10px;background:var(--surface);color:var(--fg);font:15px var(--f-body);margin-bottom:6px}
nav{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{background:none;border:0;color:var(--muted);font:600 11px var(--f-body);padding:9px 2px 11px;cursor:pointer;display:flex;flex-direction:column;align-items:center;gap:3px;min-width:0}
nav button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav button[aria-selected="true"]{color:var(--accent)}
nav button[aria-selected="true"] svg{stroke-width:2.4}
.seg{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:6px;scrollbar-width:none}
.seg button{flex:none;border:1px solid var(--line);background:var(--surface);color:var(--fg);border-radius:8px;padding:7px 12px;font:600 13px var(--f-body);cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--bg)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px}
.item{padding:9px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item .q{font-weight:600;font-size:14px;margin-bottom:6px}
.opts{display:flex;flex-wrap:wrap;gap:6px}
.opt{border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;font:500 13px var(--f-body);cursor:pointer;text-align:left}
.opt[aria-pressed="true"]{background:var(--accent-soft);border-color:var(--accent);color:var(--fg)}
.opt b{font-family:var(--f-mono);color:var(--accent)}
.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-top:1px solid var(--line);cursor:pointer}
.chk:first-child{border-top:0;padding-top:0}
.chk input{width:20px;height:20px;margin-top:1px;accent-color:var(--accent);flex:none}
.chk .pts{margin-left:auto;font:600 13px var(--f-mono);color:var(--muted)}
.result{position:sticky;bottom:calc(64px + env(safe-area-inset-bottom,0px));margin-top:12px;border-radius:12px;padding:12px 14px;display:grid;grid-template-columns:auto 1fr;gap:2px 14px;align-items:center;border:1px solid var(--line);background:var(--surface)}
.result .sc{font:700 30px/1 var(--f-mono);grid-row:span 2}
.result .t{font-weight:700}
.result .x{font-size:13px;color:var(--muted)}
.lv-ok{background:var(--ok-soft);border-color:var(--ok)} .lv-ok .sc{color:var(--ok)}
.lv-warn{background:var(--warn-soft);border-color:var(--warn)} .lv-warn .sc{color:var(--warn)}
.lv-crit{background:var(--crit-soft);border-color:var(--crit)} .lv-crit .sc{color:var(--crit)}
.reset{margin-top:8px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:6px 12px;font:500 13px var(--f-body);cursor:pointer}
ol.steps{list-style:none;margin:0;padding:0;counter-reset:s}
ol.steps li{counter-increment:s;position:relative;padding:10px 12px 10px 44px;border-top:1px solid var(--line)}
ol.steps li:first-child{border-top:0}
ol.steps li::before{content:counter(s);position:absolute;left:12px;top:10px;width:22px;height:22px;border-radius:50%;background:var(--accent-soft);color:var(--accent);font:600 12px/22px var(--f-mono);text-align:center}
ol.steps li.crit::before{background:var(--crit);color:var(--bg)}
.note{font-size:13px;color:var(--muted);margin-top:8px}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.kv div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px;min-width:0}
.kv .k{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.kv .v{font:600 18px var(--f-mono);font-variant-numeric:tabular-nums;margin-top:2px}
.kv .v small{font-size:12px;color:var(--muted);font-weight:500}
.tbl{overflow-x:auto;background:var(--surface);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}
th,td{padding:8px 10px;text-align:left;border-top:1px solid var(--line);white-space:nowrap}
th{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
.age{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
select{font:600 15px var(--f-mono);padding:6px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--fg)}
.warnbar{background:var(--warn-soft);border:1px solid var(--warn);border-radius:10px;padding:10px 12px;font-size:13px;margin-top:18px}
.infuse{display:flex;gap:8px;flex-wrap:wrap;align-items:center;padding:10px 12px;border-top:1px solid var(--line);font-size:13px}
.infuse:first-child{border-top:0}
.infuse input{font:600 14px var(--f-mono);padding:5px 8px;width:84px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--fg)}
.infuse output{font:700 16px var(--f-mono);color:var(--accent);margin-left:auto}
/* formularze kalkulatorów */
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.fld{display:flex;flex-direction:column;gap:3px;min-width:0}
.fld label{font:600 11px var(--f-mono);text-transform:uppercase;letter-spacing:.05em;color:var(--muted)}
.fld .in{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding-right:8px}
.fld input{flex:1;min-width:0;width:100%;border:0;background:none;color:var(--fg);font:600 17px var(--f-mono);padding:7px 10px}
.fld .in span{font:500 12px var(--f-mono);color:var(--muted);white-space:nowrap}
.fld select{width:100%}
.fld.full{grid-column:1/-1}
.out{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.ln{border:1px solid var(--line);border-left-width:4px;border-radius:10px;padding:9px 12px;background:var(--surface)}
.ln .t{font-weight:700}
.ln .x{font-size:13px;color:var(--muted)}
.ln .big{font:700 20px var(--f-mono);font-variant-numeric:tabular-nums}
.ln.lv-ok{border-color:var(--ok)} .ln.lv-warn{border-color:var(--warn)} .ln.lv-crit{border-color:var(--crit)} .ln.lv-info{border-left-color:var(--accent)}
.ln.lv-ok,.ln.lv-warn,.ln.lv-crit{background:var(--surface)}
.ln.lv-ok .t{color:var(--ok)} .ln.lv-warn .t{color:var(--warn)} .ln.lv-crit .t{color:var(--crit)}
.ex{font:500 11px var(--f-mono);color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin:0 0 8px}
.tox{display:grid;gap:8px}
.tox .card h3{margin:0 0 4px;font:700 15px var(--f-display)}
.pill{display:inline-block;font:600 11px var(--f-mono);padding:2px 8px;border-radius:999px;background:var(--accent-soft);color:var(--fg);margin:0 4px 4px 0}
.strow{display:flex;width:100%;align-items:center;justify-content:space-between;gap:10px;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:11px 12px;color:var(--fg);font:600 14px var(--f-body);cursor:pointer}
.list .strow:first-child{border-top:0}
.strow svg{width:16px;height:16px;flex:none;stroke:var(--muted);fill:none;stroke-width:2}
.strow:hover{background:var(--accent-soft)}
ul.crit{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
ul.crit li::marker{color:var(--accent)}
.card.flags{border-left:4px solid var(--crit)}
.card.flags ul.crit li::marker{color:var(--crit)}
@media (prefers-reduced-motion:no-preference){.result{transition:background .2s,border-color .2s}}
</style>

<header>
  <div class="brand"><h1>SOR<span>·</span>Kieszonkowy</h1>
    <button class="iconbtn" id="sbtn" aria-expanded="false"><svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-4-4"/></svg>Szukaj</button></div>
  <div id="sbox" hidden><input class="search" id="sq" type="search" placeholder="Objaw, rozpoznanie, lek, antidotum…" autocomplete="off"><div id="sres"></div></div>
  <div class="wt">
    <label for="kg">Masa ciała</label>
    <input id="kg" type="number" inputmode="decimal" min="1" max="250" value="70"> <span class="tag">kg</span>
    <div class="chips" id="kgchips"></div>
  </div>
</header>

<main id="view"></main>

<nav role="tablist">
  <button data-tab="leki" aria-selected="true"><svg viewBox="0 0 24 24"><rect x="3" y="9" width="18" height="6" rx="3" transform="rotate(-45 12 12)"/><path d="M9.5 9.5l5 5"/></svg>Leki</button>
  <button data-tab="skale" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>Skale</button>
  <button data-tab="algo" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg>Stany</button>
  <button data-tab="tox" aria-selected="false"><svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v6l-5 9a2 2 0 002 3h10a2 2 0 002-3l-5-9V3"/><path d="M7.5 15h9"/></svg>Zatrucia</button>
  <button data-tab="calc" aria-selected="false"><svg viewBox="0 0 24 24"><rect x="5" y="3" width="14" height="18" rx="2"/><path d="M8 7h8M8 12h2M14 12h2M8 16h2M14 16h2"/></svg>Kalkulatory</button>
</nav>

<script>
/* Baza stanów nagłych: kryteria rozpoznania i postępowanie. Format: S(nazwa, aliasy, kryteria "|", postępowanie "|", źródło) */
var STANY = window.STANY = [];
var _cat = '';
function C(n){ _cat = n; }
function S(n, k, kr, po, src){ STANY.push({n:n, k:k, c:_cat, kr:kr.split('|'), po:po.split('|'), src:src}); }

C('Kardiologia');
S('STEMI – zawał z uniesieniem ST','zawał serca ozw mi','Ból wieńcowy > 20 min lub równoważnik|Uniesienie ST w ≥ 2 sąsiednich odprowadzeniach: ≥ 1 mm; V2–V3: ≥ 2,5 mm (mężczyźni < 40 r.ż.), ≥ 2 mm (≥ 40 r.ż.), ≥ 1,5 mm (kobiety)|Równoważniki: nowy LBBB lub rytm ze stymulatora z objawami niedokrwienia, zawał ściany tylnej (obniżenia ST V1–V3, uniesienia V7–V9), uniesienie ST w aVR z rozlanymi obniżeniami','EKG ≤ 10 min od pierwszego kontaktu, monitorowanie, defibrylator w gotowości|ASA 150–300 mg p.o. (lub 75–250 mg i.v.)|Heparyna niefrakcjonowana 70–100 j./kg i.v.|Pierwotna PCI ≤ 120 min od rozpoznania; gdy niemożliwa: fibrynoliza ≤ 10 min (tenekteplaza wg masy, ≥ 75 r.ż. połowa dawki), potem transfer|Inhibitor P2Y12 (prasugrel lub tikagrelor) wg protokołu pracowni|Tlen tylko przy SpO₂ < 90%; opioid przy silnym bólu','ESC 2023 – OZW');
S('NSTE-ACS – zawał bez uniesienia ST','nstemi niestabilna dławica ozw troponina','Ból wieńcowy bez przetrwałego uniesienia ST|Dynamika hs-troponiny powyżej 99. percentyla (algorytm 0/1 h lub 0/2 h)|EKG: obniżenia ST, ujemne załamki T lub zapis prawidłowy','ASA 150–300 mg; antykoagulacja (fondaparynuks 2,5 mg s.c. lub HNF/enoksaparyna)|Bardzo wysokie ryzyko (niestabilność hemodynamiczna, nawracający ból, groźne arytmie, ostra niewydolność serca, powikłania mechaniczne): koronarografia < 2 h|Wysokie ryzyko (potwierdzony NSTEMI, dynamiczne zmiany ST, GRACE > 140): koronarografia < 24 h|Niejasny ból: skala HEART, powtórna troponina','ESC 2023 – OZW');
S('Ostra niewydolność serca / obrzęk płuc','ahf obrzęk płuc niewydolność serca duszność','Duszność, orthopnoe, trzeszczenia, obrzęki, poszerzone żyły szyjne|NT-proBNP ≥ 300 pg/ml lub BNP ≥ 100 pg/ml (niższe wartości praktycznie wykluczają)|USG: liczne linie B, poszerzona IVC; RTG: cechy zastoju','Pozycja siedząca; tlen przy SpO₂ < 90%; NIV/CPAP przy niewydolności oddechowej|Furosemid i.v. 20–40 mg lub 1–2,5 × dawka domowa|Nitraty i.v. przy SBP > 110 mmHg|Szukaj przyczyny (CHAMPIT): OZW, przełom nadciśnieniowy, arytmia, przyczyna mechaniczna, zatorowość płucna, infekcja, tamponada|Hipoperfuzja: patrz wstrząs kardiogenny','ESC 2021/2023 – niewydolność serca');
S('Wstrząs kardiogenny','wstrząs kardiogenny hipoperfuzja','SBP < 90 mmHg > 30 min lub konieczność wazopresorów|Objawy hipoperfuzji: zimna skóra, oliguria, splątanie, mleczany > 2 mmol/l|Przyczyna sercowa (najczęściej OZW)','EKG, echo przyłóżkowe, pilna koronarografia przy OZW|Noradrenalina jako wazopresor pierwszego wyboru; dobutamina przy niskim rzucie|Ostrożna płynoterapia (wyjątek: zawał prawej komory)|Wczesny kontakt z ośrodkiem z mechanicznym wspomaganiem krążenia','ESC 2023');
S('Migotanie przedsionków','af afib arytmia niemiarowość','Niemiarowy rytm komór bez wyraźnych załamków P|Epizod ≥ 30 s lub cały zapis 12-odprowadzeniowy','Niestabilny: kardiowersja elektryczna zsynchronizowana|Stabilny, < 24–48 h lub po ≥ 3 tyg. antykoagulacji (albo TEE): kardiowersja farmakologiczna (amiodaron; flekainid/propafenon bez strukturalnej choroby serca) lub elektryczna|Kontrola częstości: beta-bloker, diltiazem/werapamil (EF > 40%), digoksyna|Antykoagulacja wg CHA₂DS₂-VA (≥ 2 zalecana)|Szukaj przyczyn: infekcja, tyreotoksykoza, alkohol, ZTP','ESC 2024 – AF');
S('Trzepotanie przedsionków','afl trzepotanie','Fale F ok. 300/min (zęby piły w II, III, aVF)|Częsta odpowiedź komór 150/min (przewodzenie 2:1)','Jak w migotaniu przedsionków; kardiowersja elektryczna skuteczna przy niskiej energii|Kontrola częstości bywa trudna|Antykoagulacja jak w AF; ablacja jako leczenie definitywne','ESC 2019/2024');
S('Częstoskurcz nadkomorowy (AVNRT/AVRT)','svt psvt częstoskurcz nawrotny','Miarowy częstoskurcz z wąskimi QRS 150–250/min|Nagły początek i koniec','Niestabilny: kardiowersja zsynchronizowana|Zmodyfikowany manewr Valsalvy|Adenozyna 6 → 12 → 18 mg szybko i.v.|Werapamil 5 mg i.v. lub beta-bloker|AF z preekscytacją (szerokie, niemiarowe QRS): NIE adenozyna/werapamil/digoksyna; kardiowersja lub prokainamid','ESC 2019 SVT, ERC 2025');
S('Częstoskurcz komorowy z tętnem','vt częstoskurcz komorowy szerokie qrs','Szerokie QRS ≥ 120 ms, zwykle miarowe|Rozkojarzenie przedsionkowo-komorowe, pobudzenia zsumowane lub przewiedzione','Bez tętna: algorytm ALS|Niestabilny: kardiowersja zsynchronizowana (do 3 prób), potem amiodaron 300 mg|Stabilny: amiodaron 300 mg i.v. w 10–20 min (lub prokainamid)|Szukaj niedokrwienia, wyrównaj K⁺ i Mg²⁺','ERC 2025, ESC 2022');
S('Torsade de pointes','tdp długie qt polimorficzny','Polimorficzny częstoskurcz komorowy ze „skręcaniem” osi QRS|Wydłużony QTc w zapisie wyjściowym','MgSO₄ 2 g i.v. (bez tętna – w bolusie)|Odstaw leki wydłużające QT; K⁺ do 4,5–5,0 mmol/l|Bradykardia: stymulacja lub izoprenalina|Bez tętna: defibrylacja','ERC 2025, ESC 2022');
S('Blok przedsionkowo-komorowy III stopnia','blok av całkowity bradykardia','Brak związku między załamkami P a QRS|Rytm zastępczy wąski (węzłowy) lub szeroki (komorowy)','Atropina 0,5 mg (często nieskuteczna przy bloku poniżej pęczka Hisa)|Adrenalina 2–10 µg/min lub izoprenalina|Stymulacja przezskórna, potem przezżylna|Przyczyny: hiperkaliemia, beta-blokery/BKW/digoksyna, zawał ściany dolnej, borelioza','ERC 2025, ESC 2021 – stymulacja');
S('Rozwarstwienie aorty','rozwarstwienie aorty aad dysekcja','Nagły, rozdzierający ból w klatce piersiowej lub plecach|Deficyt tętna, różnica RR między kończynami > 20 mmHg, niedomykalność aortalna, objawy neurologiczne|ADD-RS ≥ 2 lub 1 z D-dimerami ≥ 500 ng/ml → angio-TK','HR < 60/min i SBP 100–120 mmHg: najpierw beta-bloker i.v. (esmolol, labetalol), potem wazodilatator (urapidyl, nitroprusydek)|Analgezja opioidami|Typ A: pilnie kardiochirurgia|Typ B powikłany (niedokrwienie, pęknięcie): TEVAR','ESC 2024 – choroby aorty');
S('Pęknięty tętniak aorty brzusznej','aaa tętniak pęknięty','Ból brzucha, pleców lub boku, hipotensja, tętniący guz w brzuchu|USG przyłóżkowe: tętniak > 3 cm','Permisywna hipotensja (SBP 70–90 mmHg przy zachowanej świadomości)|Krew i protokół masywnego przetoczenia|Natychmiastowa konsultacja chirurga naczyniowego (EVAR lub operacja)|U niestabilnego nie opóźniaj zabiegu dla TK','ESVS 2024');
S('Tamponada serca','tamponada płyn osierdzie','Triada Becka: hipotensja, poszerzone żyły szyjne, ściszone tony serca|Tętno paradoksalne > 10 mmHg|Echo: płyn z zapadaniem RA/RV w rozkurczu, poszerzona nieoddechowa IVC','Perikardiocenteza pod kontrolą echa|Płyny jako pomost|Uraz penetrujący: torakotomia ratunkowa / perikardiotomia','ESC 2015/2025 – choroby osierdzia');
S('Ostre zapalenie osierdzia','zapalenie osierdzia perikarditis','≥ 2 z 4: ból opłucnowy (ulga przy pochyleniu do przodu), tarcie osierdziowe, rozlane uniesienia ST z obniżeniem PR, nowy lub narastający płyn','ASA 750–1000 mg co 8 h lub ibuprofen 600 mg co 8 h przez 1–2 tyg. z ochroną żołądka|Kolchicyna 0,5 mg 1–2 ×/d przez 3 mies.|Hospitalizacja przy: gorączce > 38 °C, dużym płynie, tamponadzie, braku poprawy po NLPZ, podwyższonej troponinie, immunosupresji|Ograniczenie wysiłku','ESC 2015/2025');
S('Zapalenie mięśnia sercowego','myocarditis zapalenie mięśnia sercowego','Ból w klatce, duszność, kołatanie, często po infekcji wirusowej|Podwyższona troponina, zmiany w EKG, zaburzenia kurczliwości w echu|Potwierdzenie: MRI serca (kryteria Lake Louise) lub biopsja','Wyklucz OZW (koronarografia lub angio-TK)|Leczenie niewydolności serca i arytmii; monitorowanie|Unikanie wysiłku 3–6 mies.|Piorunujące: wczesne wsparcie mechaniczne','ESC 2023 – kardiomiopatie');
S('Stan nagły w nadciśnieniu tętniczym','przełom nadciśnieniowy hypertensive emergency','Zwykle RR > 180/120 mmHg z ostrym uszkodzeniem narządowym: encefalopatia, OZW, obrzęk płuc, rozwarstwienie aorty, stan przedrzucawkowy, ostre uszkodzenie nerek, retinopatia złośliwa|Bez uszkodzenia narządowego = pilne nadciśnienie (leczenie doustne)','Obniż MAP o ≤ 25% w pierwszej godzinie|Wyjątki: rozwarstwienie aorty (SBP < 120 w 20 min), obrzęk płuc/OZW (SBP < 140)|Leki: labetalol, urapidyl, nitrogliceryna (OZW, obrzęk płuc), nitroprusydek|Nie obniżaj gwałtownie RR w udarze niedokrwiennym bez trombolizy','ESC/ESH 2023–2024');
S('Omdlenie','omdlenie syncope utrata przytomności','Przejściowa utrata przytomności z szybkim, pełnym powrotem|Cechy wysokiego ryzyka: omdlenie w wysiłku lub leżeniu, kołatanie przed, ból w klatce, duszność, strukturalna choroba serca, nagłe zgony w rodzinie|EKG wysokiego ryzyka: blok AV II/III, bradykardia < 40, zespół Brugadów, wydłużony QT, preekscytacja, VT','EKG, RR na leżąco i stojąco, glikemia, morfologia|Kanadyjska skala ryzyka omdleń (CSRS)|Niskie ryzyko (odruchowe, ortostatyczne): wypis z edukacją|Wysokie ryzyko: monitorowanie EKG, hospitalizacja lub oddział obserwacyjny','ESC 2018 – omdlenia');
S('Zatorowość płucna','zatorowość płucna ztp pe zator','Ocena prawdopodobieństwa: Wells lub Geneva, PERC przy niskim|D-dimery (próg wg wieku > 50 r.ż.: wiek × 10 µg/l), potem angio-TK|Wysokie ryzyko: wstrząs lub SBP < 90 mmHg; pośrednie: sPESI ≥ 1, dysfunkcja RV, troponina','Wysokie ryzyko: tromboliza (alteplaza 100 mg w 2 h) lub embolektomia; heparyna niefrakcjonowana|Pośrednie wysokie: heparyna, monitorowanie, tromboliza ratunkowa przy pogorszeniu|Niskie: NOAC lub HDCz, rozważ leczenie ambulatoryjne (sPESI 0, kryteria Hestia)','ESC 2019 – ZTP');
S('Infekcyjne zapalenie wsierdzia','ize endocarditis zapalenie wsierdzia','Zmodyfikowane kryteria Duke (ESC 2023)|Duże: dodatnie posiewy z typowym drobnoustrojem; zmiany w echu, PET/TK|Małe: predyspozycja, gorączka > 38 °C, zjawiska naczyniowe i immunologiczne','3 zestawy posiewów krwi przed antybiotykiem|TTE, a przy podejrzeniu i ujemnym TTE: TEE|Empiryczna antybiotykoterapia wg ESC 2023 (zastawka natywna vs sztuczna)|Pilna konsultacja kardiochirurgiczna: niewydolność serca, ropień, duże wegetacje, zatory','ESC 2023 – IZW');
S('Burza elektryczna / wyładowania ICD','icd kardiowerter wyładowania burza elektryczna','≥ 3 adekwatne interwencje ICD (VT/VF) w ciągu 24 h|Wyładowania nieadekwatne: AF, uszkodzenie elektrody','Monitorowanie, elektrolity (K⁺, Mg²⁺), szukaj niedokrwienia|Burza elektryczna: amiodaron i.v., beta-bloker, sedacja|Wyładowania nieadekwatne: magnes nad ICD wstrzymuje terapię wysokoenergetyczną (przy monitorowaniu)|Kontakt z pracownią elektrofizjologii','ESC 2022 – arytmie komorowe');

C('Pulmonologia');
S('Zaostrzenie astmy','astma napad duszność świsty','Ciężkie: nie mówi pełnymi zdaniami, RR ≥ 25/min, HR ≥ 110/min, PEF 33–50%|Zagrażające życiu: PEF < 33%, SpO₂ < 92%, cicha klatka, sinica, wyczerpanie, zaburzenia świadomości, normo- lub hiperkapnia','Tlen do SpO₂ 93–95%|Salbutamol 2,5–5 mg w nebulizacji, powtarzany lub ciągły; ipratropium 0,5 mg|Prednizolon 40–50 mg p.o. lub hydrokortyzon 100 mg i.v.|Ciężkie: MgSO₄ 2 g i.v. w 20 min|Gazometria przy SpO₂ < 92%; wczesna konsultacja OIT, intubacja z ketaminą','GINA 2025, BTS/SIGN');
S('Zaostrzenie POChP','pochp copd zaostrzenie','Nasilenie duszności, kaszlu lub ropnej plwociny ponad zmienność dobową|Gazometria: ocena kwasicy oddechowej','Tlen do SpO₂ 88–92%|SABA ± SAMA w nebulizacji|Prednizon 40 mg przez 5 dni|Antybiotyk przy ropnej plwocinie (amoksycylina z klawulanianem lub doksycyklina)|NIV przy pH < 7,35 i PaCO₂ > 45 mmHg','GOLD 2025');
S('Pozaszpitalne zapalenie płuc','zapalenie płuc pneumonia pzp cap','Objawy infekcji dolnych dróg oddechowych + nowy naciek w RTG lub USG|Ocena ciężkości: CURB-65 (Skale)','0–1 pkt: leczenie ambulatoryjne (amoksycylina)|2 pkt: hospitalizacja (amoksycylina z klawulanianem lub ceftriakson ± makrolid)|≥ 3 pkt/OIT: ceftriakson + makrolid lub fluorochinolon|Antybiotyk ≤ 4 h, przy sepsie ≤ 1 h; posiewy krwi w ciężkim','Rekomendacje PTChP/KORD, BTS');
S('Odma opłucnowa samoistna','odma samoistna pneumothorax','Nagły ból opłucnowy, duszność, osłabiony szmer|USG: brak objawu ślizgania, punkt płucny; RTG','Pierwotna, bez objawów: obserwacja lub leczenie ambulatoryjne|Objawowa: aspiracja igłowa lub dren małokalibrowy|Wtórna (choroba płuc): drenaż, hospitalizacja|Kontrola RTG, zakaz lotów i nurkowania','BTS 2023');
S('Odma prężna','odma prężna tension pneumothorax','Duszność, hipoksja, hipotensja, brak szmeru po jednej stronie|Poszerzone żyły szyjne; przesunięcie tchawicy – objaw późny|Rozpoznanie kliniczne – nie czekaj na RTG','Natychmiastowe odbarczenie: torakostomia palcowa lub igłowa (4.–5. międzyżebrze, linia pachowa przednia/środkowa)|Następnie drenaż opłucnej','ATLS 10, ERC 2025');
S('Masywne krwioplucie','krwioplucie hemoptysis','Krwioplucie zagrażające życiu (zwykle > 100–600 ml/24 h lub upośledzające wymianę gazową)','Ułożenie na stronie krwawiącej|Zabezpieczenie dróg oddechowych (rurka ≥ 8), ewentualnie intubacja selektywna|Kwas traneksamowy; odwrócenie antykoagulacji|Angio-TK, embolizacja tętnic oskrzelowych, bronchoskopia','ERS/BTS');
S('ARDS','ards zespół ostrej niewydolności oddechowej','Początek ≤ 1 tyg. od czynnika|Obustronne zacienienia (RTG, TK lub USG)|Nie w pełni wyjaśnione niewydolnością serca|PaO₂/FiO₂ ≤ 300 przy PEEP ≥ 5 (lub SpO₂/FiO₂ ≤ 315; HFNO ≥ 30 l/min – definicja globalna 2024)','Leczenie przyczyny|Wentylacja protekcyjna: Vt 6 ml/kg należnej masy, Pplat ≤ 30 cm H₂O, odpowiedni PEEP|Pozycja na brzuchu przy PaO₂/FiO₂ < 150|Restrykcyjna płynoterapia','Definicja globalna 2024, ESICM 2023');
S('Płyn w jamie opłucnej / ropniak','płyn opłucnowy wysięk ropniak','USG: płyn w jamie opłucnej|Kryteria Lighta: wysięk przy białku płyn/surowica > 0,5, LDH płyn/surowica > 0,6 lub LDH > ⅔ górnej normy|Ropniak: ropa, pH < 7,2, glukoza < 2,2 mmol/l','Torakocenteza diagnostyczna pod USG|Odbarczenie przy duszności (≤ 1,5 l jednorazowo)|Ropniak lub powikłany wysięk: drenaż + antybiotyk','BTS 2023');
S('Ciało obce w drogach oddechowych (dorośli)','zadławienie ciało obce choking','Nagła duszność, kaszel, niemożność mówienia|Skuteczny kaszel = łagodna niedrożność','Zachęcaj do kaszlu|Nieskuteczny kaszel: 5 uderzeń w okolicę międzyłopatkową, potem 5 uciśnięć nadbrzusza, naprzemiennie|Utrata przytomności: RKO|Laryngoskopia i kleszczyki Magilla; krikotyreotomia w ostateczności','ERC 2025');
S('Obrzęk naczynioruchowy bradykininowy','obrzęk quinckego angioedema ace-i hae','Obrzęk twarzy, języka lub krtani bez pokrzywki i świądu|Związek z ACE-I lub dziedziczny niedobór C1-INH|Słaba odpowiedź na adrenalinę i steroidy','Ocena i zabezpieczenie dróg oddechowych (intubacja fiberoskopowa, gotowość do krikotyreotomii)|Odstaw ACE-I|Ikatybant 30 mg s.c. lub koncentrat C1-INH 20 j./kg|Gdy niedostępne: osocze świeżo mrożone','WAO/EAACI 2021');
S('Zapalenie nagłośni','zapalenie nagłośni epiglottitis','Silny ból gardła, ślinotok, dysfagia, stridor, pozycja „trójnogu”|Głos stłumiony|Laryngoskopia pośrednia lub fiberoskopia u dorosłych; u dzieci nie badaj gardła szpatułką','Pozycja siedząca, tlen, unikaj niepokojenia dziecka|Pilna konsultacja anestezjologiczna i laryngologiczna; zabezpieczenie dróg oddechowych w warunkach sali operacyjnej|Ceftriakson i.v.','Standardy laryngologiczne, APLS');
S('Zachłystowe zapalenie płuc','aspiracja zachłyśnięcie aspiration','Epizod aspiracji (zaburzenia świadomości, dysfagia, wymioty)|Naciek w segmentach zależnych (prawy dolny płat)','Odsysanie, tlen, ułożenie|Zachłystowe zapalenie płuc (chemiczne) – zwykle bez antybiotyku przez pierwsze 48 h|Zapalenie płuc: amoksycylina z klawulanianem lub ceftriakson; pokrycie beztlenowców tylko przy ropniu lub ropniaku','ATS/IDSA 2019');

C('Neurologia');
S('Udar niedokrwienny mózgu','udar niedokrwienny stroke tromboliza','Nagły ogniskowy deficyt neurologiczny (BE-FAST)|NIHSS do oceny ciężkości|TK bez kontrastu + angio-TK (okluzja dużego naczynia)|Wyklucz hipoglikemię','Czas od zachorowania (ostatnio widziany zdrowy); glikemia|Tromboliza do 4,5 h: alteplaza 0,9 mg/kg (maks. 90 mg) lub tenekteplaza 0,25 mg/kg (maks. 25 mg)|Trombektomia przy okluzji dużego naczynia do 6 h (do 24 h przy niedopasowaniu w obrazowaniu)|RR < 185/110 przed i < 180/105 po trombolizie|Bez trombolizy RR obniżaj dopiero > 220/120','ESO 2021–2023, AHA/ASA 2019');
S('Krwotok śródmózgowy','krwotok śródmózgowy ich udar krwotoczny','Nagły deficyt, ból głowy, wymioty, zaburzenia świadomości|TK: hiperdensyjne ognisko','SBP celem 140 mmHg (zakres 130–150) w ciągu 1 h|Odwrócenie antykoagulacji: PCC + wit. K (AWK), idarucyzumab (dabigatran), andeksanet lub PCC (inhibitory Xa)|Glikemia, normotermia|Neurochirurgia: krwiak móżdżku > 3 cm, wodogłowie, wgłobienie','ESO 2021, AHA 2022');
S('Krwotok podpajęczynówkowy','sah krwotok podpajęczynówkowy tętniak','Piorunujący ból głowy (szczyt < 1 min), „najgorszy w życiu”|Wymioty, sztywność karku, utrata przytomności|Reguła Ottawa SAH|TK ≤ 6 h od początku – bardzo czułe; później punkcja lędźwiowa (ksantochromia) lub angio-TK','Analgezja, przeciwwymiotne, SBP < 160 mmHg|Nimodypina 60 mg p.o. co 4 h|Odwrócenie antykoagulacji|Pilna konsultacja neurochirurgiczna/neuroradiologiczna (embolizacja lub klipsowanie)','ESO 2013, AHA 2023');
S('Przemijający napad niedokrwienny (TIA)','tia przemijający napad niedokrwienny','Przemijający ogniskowy deficyt neurologiczny bez cech zawału w MRI','Pilna diagnostyka ≤ 24 h: angio-TK lub USG tętnic szyjnych, EKG/monitorowanie|ASA; DAPT (ASA + klopidogrel 21 dni) przy łagodnym udarze (NIHSS ≤ 3) lub TIA wysokiego ryzyka|Statyna, leczenie czynników ryzyka; antykoagulacja przy AF','ESO 2021');
S('Stan padaczkowy','stan padaczkowy status epilepticus drgawki','Napad uogólniony ≥ 5 min lub ≥ 2 napady bez powrotu świadomości między nimi','0–5 min: ABC, tlen, glikemia, dostęp i.v.|5–20 min: benzodiazepina (midazolam 10 mg i.m., lorazepam 4 mg i.v., diazepam 10 mg i.v.); można powtórzyć raz|20–40 min: lewetyracetam 60 mg/kg (maks. 4,5 g) lub walproinian 40 mg/kg lub fenytoina 20 mg/kg|> 40 min: znieczulenie ogólne (propofol, midazolam, tiopental), EEG, OIT|Tiamina przy alkoholizmie','AES 2016, ESETT, PTN');
S('Pierwszy napad padaczkowy','pierwszy napad drgawki','Napad u osoby bez rozpoznanej padaczki|Różnicuj z omdleniem drgawkowym, napadem psychogennym','Glikemia, elektrolity (Na, Ca, Mg), alkohol, toksykologia, ciąża|TK głowy (pilnie przy deficycie, urazie, antykoagulacji, > 40 r.ż.)|Powrót do normy + prawidłowe badania: wypis z opieką, skierowanie do neurologa (EEG, MRI)|Zakaz prowadzenia pojazdów','ILAE, NICE');
S('Bakteryjne zapalenie opon mózgowo-rdzeniowych','zomr zapalenie opon meningitis','Gorączka, sztywność karku, zaburzenia świadomości, ból głowy (≥ 2 z 4 u 95%)|Wybroczyny niebledniejące sugerują meningokoki|PMR: pleocytoza neutrofilowa, niska glukoza, wysokie białko','Posiewy krwi, antybiotyk ≤ 1 h|Deksametazon 10 mg i.v. przed lub z pierwszą dawką antybiotyku|Ceftriakson 2 g co 12 h; + ampicylina > 50 r.ż./immunosupresja/ciąża; + wankomycyna przy podejrzeniu oporności|TK przed PL tylko przy: deficycie ogniskowym, GCS < 10, napadach, immunosupresji – nie opóźniaj antybiotyku','ESCMID 2016');
S('Zapalenie mózgu (HSV)','zapalenie mózgu encephalitis hsv opryszczkowe','Gorączka + zaburzenia zachowania lub świadomości, napady, objawy ogniskowe|MRI (płaty skroniowe), PL z PCR HSV, EEG','Acyklowir 10 mg/kg i.v. co 8 h empirycznie, bez czekania na wynik|Leczenie napadów, OIT przy pogorszeniu','ESCMID, BIA/ABN');
S('Zespół Guillaina-Barrégo','gbs guillain barre polineuropatia','Postępujące symetryczne wiotkie osłabienie kończyn, arefleksja|Często po infekcji|PMR: rozszczepienie białkowo-komórkowe (po 1. tyg.); ENG','Monitorowanie FVC (< 20 ml/kg lub spadek > 30% → OIT/intubacja)|Dysautonomia: monitorowanie EKG i RR|IVIG 0,4 g/kg/d przez 5 dni lub plazmafereza|Profilaktyka ZŻG','EAN/PNS 2023');
S('Przełom miasteniczny','miastenia przełom myasthenic crisis','Znana lub podejrzewana miastenia|Osłabienie opuszkowe, dysfagia, niewydolność oddechowa|FVC < 20 ml/kg','OIT, wczesna intubacja (unikaj sukcynylocholiny)|IVIG lub plazmafereza|Odstaw leki nasilające (aminoglikozydy, fluorochinolony, makrolidy, Mg, beta-blokery)|Różnicuj z przełomem cholinergicznym','MGFA, EAN');
S('Ucisk rdzenia kręgowego / zespół ogona końskiego','ucisk rdzenia ogon koński cauda equina','Ból pleców + deficyt ruchowy/czuciowy|Zatrzymanie lub nietrzymanie moczu, znieczulenie siodłowate, osłabione napięcie zwieracza|Nowotwór w wywiadzie – przerzuty','Pilny MRI całego kręgosłupa|Nowotworowy: deksametazon 16 mg/d, onkologia/radioterapia, neurochirurgia|Ogon koński: pilna dekompresja chirurgiczna|Ocena zalegania moczu (USG)','NICE 2023 – MSCC');
S('Ból głowy – czerwone flagi','ból głowy snoop czerwone flagi','SNOOP10: objawy ogólne, neurologiczne, nagły początek, wiek > 50 lat, zmiana charakteru, ból przy Valsalvie, pozycyjny, ciąża, obrzęk tarczy, immunosupresja, nowotwór, uraz|Piorunujący ból: wyklucz SAH','TK głowy (+ angio-TK), PL wg wskazań|Rozważ: SAH, zakrzepicę zatok żylnych, rozwarstwienie tętnic, zapalenie opon, OZT, przełom nadciśnieniowy, CO|Migrena: NLPZ, metoklopramid, sumatryptan; unikaj opioidów','EHF, AHS');
S('Olbrzymiokomórkowe zapalenie tętnic','ozt arteritis olbrzymiokomórkowe horton','> 50 r.ż., nowy ból głowy (okolica skroni), chromanie żuchwy, zaburzenia widzenia, objawy polimialgii|OB/CRP podwyższone|USG tętnic skroniowych (objaw halo) lub biopsja','Prednizon 40–60 mg/d natychmiast, nie czekaj na biopsję|Zaburzenia widzenia: metyloprednizolon 500–1000 mg i.v. przez 3 dni|Pilna konsultacja okulistyczna/reumatologiczna','EULAR 2018/2023');

<script>
const $=s=>document.querySelector(s), V=()=>$('#view');
const store={get(k,d){try{const v=localStorage.getItem(k);return v===null?d:JSON.parse(v)}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
let kg=store.get('kg',70); $('#kg').value=kg;
const fmt=(x,dp)=>{if(x==null||!isFinite(x))return '—';const d=dp??(Math.abs(x)<1?2:Math.abs(x)<10?1:0);return (+x.toFixed(d)).toLocaleString('pl-PL')};

/* ===== wspólne: lista leków ===== */
function doseText(it){
  if(it.fixed)return it.fixed;
  let cap='';
  const vs=it.d.map(x=>x*kg).map(x=>it.max&&x>it.max?(cap=' (maks.)',it.max):x);
  return vs.map(x=>fmt(x)).join('–')+' '+it.u+cap;
}
function perKg(it){return it.d.map(x=>fmt(x,3)).join('–')+' '+it.u.replace('/h','')+'/kg'+(it.u.includes('/h')?'/h':'')}
function listHTML(groups,filter){
  const f=(filter||'').toLowerCase(); let h='';
  groups.forEach(gr=>{
    if(!gr.items)return;
    const its=gr.items.filter(i=>!f||i.n.toLowerCase().includes(f)||gr.g.toLowerCase().includes(f)); if(!its.length)return;
    h+=`<div class="sub">${gr.g}</div><div class="list">`+its.map(i=>`<div class="row"><div class="n">${i.n}</div><div class="d">${doseText(i)}</div>${(i.d||i.m)?`<div class="m">${i.d?perKg(i)+(i.max?' · maks. '+fmt(i.max)+' '+i.u:'')+(i.m?' · ':''):''}${i.m||''}</div>`:''}</div>`).join('')+'</div>';
  });
  return h||'<p class="note">Brak wyników.</p>';
}

/* ===== LEKI: dorośli ===== */
const DRUGS=[
 {g:'NZK (ALS, dorośli)',items:[
  {n:'Adrenalina',fixed:'1 mg i.v./i.o.',m:'Co 3–5 min. VF/pVT: po 3. defibrylacji; asystolia/PEA: najszybciej jak to możliwe.'},
  {n:'Amiodaron',fixed:'300 mg → 150 mg',m:'VF/pVT: 300 mg po 3. defibrylacji, 150 mg po 5.'},
  {n:'Defibrylacja (dwufazowa)',fixed:'150–200 J',m:'Kolejne wyładowania 150–360 J wg producenta.'}]},
 {g:'Intubacja RSI',items:[
  {n:'Ketamina',d:[1,2],u:'mg',m:'Indukcja; stabilna hemodynamika.'},
  {n:'Etomidat',d:[0.3],u:'mg',m:'Indukcja.'},
  {n:'Propofol',d:[1,2],u:'mg',m:'Zmniejsz dawkę we wstrząsie / u starszych.'},
  {n:'Fentanyl',d:[1,3],u:'µg',m:'Premedykacja / analgezja.'},
  {n:'Rokuronium',d:[1.2],u:'mg',m:'Zwiotczenie do RSI.'},
  {n:'Sukcynylocholina',d:[1.5],u:'mg',m:'P/wsk.: hiperkaliemia, oparzenia >24 h, choroby nerwowo-mięśniowe.'},
  {n:'Sugammadeks (natychmiastowe odwrócenie)',d:[16],u:'mg',m:'Odwrócenie rokuronium w sytuacji CICO.'}]},
 {g:'Anafilaksja i krążenie',items:[
  {n:'Adrenalina i.m. (anafilaksja)',d:[0.01],u:'mg',max:0.5,m:'Przednio-boczna część uda; powtórz po 5 min.'},
  {n:'Atropina (bradykardia)',fixed:'0,5 mg i.v.',m:'Powtarzaj co 3–5 min, maks. 3 mg.'},
  {n:'Adenozyna (SVT)',fixed:'6 → 12 → 18 mg',m:'Szybki bolus i.v. z przepłukaniem 20 ml NaCl.'},
  {n:'Amiodaron (tachykardia stabilna)',fixed:'300 mg / 10–20 min',m:'Następnie 900 mg / 24 h.'},
  {n:'Siarczan magnezu',fixed:'2 g i.v.',m:'Torsade de pointes, ciężka astma: w 10–20 min.'},
  {n:'Płyny w sepsie / hipotensji',d:[30],u:'ml',m:'Krystaloid w ciągu 3 h, ocena odpowiedzi.'}]},
 {g:'Krzepnięcie i tromboliza',items:[
  {n:'Kwas traneksamowy',fixed:'1 g / 10 min',m:'Uraz < 3 h; następnie 1 g / 8 h.'},
  {n:'Heparyna niefrakcj. (ZTP) – bolus',d:[80],u:'j.m.',m:'Następnie wlew 18 j.m./kg/h, kontrola APTT.'},
  {n:'Heparyna niefrakcj. – wlew',d:[18],u:'j.m./h'},
  {n:'Enoksaparyna (dawka lecznicza)',d:[1],u:'mg',m:'Co 12 h s.c.; korekta przy niewydolności nerek.'},
  {n:'Alteplaza (udar)',d:[0.9],u:'mg',max:90,m:'10% w bolusie, reszta we wlewie przez 60 min.'}]},
 {g:'Stan padaczkowy',items:[
  {n:'Midazolam i.m.',fixed:'10 mg (>40 kg)',m:'5 mg przy 13–40 kg.'},
  {n:'Lorazepam i.v.',d:[0.1],u:'mg',max:4,m:'Można powtórzyć raz.'},
  {n:'Lewetyracetam i.v.',d:[60],u:'mg',max:4500,m:'Druga linia; w 10 min.'},
  {n:'Walproinian i.v.',d:[40],u:'mg',max:3000,m:'Druga linia; unikaj w ciąży.'}]},
 {g:'Inne',items:[
  {n:'Nalokson',fixed:'0,04–0,4 mg i.v.',m:'Miareczkuj co 2–3 min do wydolnego oddechu. Więcej w zakładce Zatrucia.'},
  {n:'Ondansetron',fixed:'4 mg i.v.'},
  {n:'Glukoza 20% (hipoglikemia, nieprzytomny)',d:[1,2.5],u:'ml',m:'= 0,2–0,5 g glukozy/kg (PTD), następnie wlew 10% glukozy.'},
  {n:'Glukagon (brak dostępu i.v.)',fixed:'1 mg i.m./s.c.',m:'Dzieci < 25 kg: 0,5 mg.'},
  {n:'Morfina',d:[0.1],u:'mg',max:10,m:'Miareczkuj po 2–3 mg.'}]}
];
const INF=[
 {n:'Noradrenalina',c:[4,50],du:'µg/kg/min',dose:0.1,m:'Zakres 0,05–0,5'},
 {n:'Adrenalina',c:[4,50],du:'µg/kg/min',dose:0.05,m:'Zakres 0,02–0,3'},
 {n:'Dobutamina',c:[250,50],du:'µg/kg/min',dose:5,m:'Zakres 2,5–20'},
 {n:'Propofol (sedacja)',c:[10,1],du:'mg/kg/h',dose:2,m:'Stężenie 10 mg/ml; zakres 1–4'}];
function infRate(i){const conc=i.c[0]/i.c[1]; return i.du==='µg/kg/min'? i.dose*kg*60/(conc*1000) : i.dose*kg/conc;}
let q='', lekiMode=store.get('lm','dor');
function renderLeki(){
  let h=`<div class="seg"><button data-lm="dor" aria-pressed="${lekiMode==='dor'}">Dorośli</button><button data-lm="dz" aria-pressed="${lekiMode==='dz'}">Dzieci</button></div>`;
  if(lekiMode==='dz'){V().innerHTML=h+pedHTML();bindLm();bindPed();return}
  const qq=q.toLowerCase();
  h+=`<input class="search" id="q" type="search" placeholder="Filtruj leki…" value="${q}">`;
  h+=listHTML(DRUGS.slice(0,3),q);
  const infs=INF.map((i,ix)=>[i,ix]).filter(([i])=>!qq||i.n.toLowerCase().includes(qq)||'wlewy'.includes(qq));
  if(infs.length){
    h+=`<div class="sub">Wlewy ciągłe</div><div class="list">`+infs.map(([i,ix])=>`<div class="infuse"><span style="font-weight:600;width:100%;font-size:15px">${i.n} <span class="tag">${i.c[0]} mg / ${i.c[1]} ml · ${i.m}</span></span>
      <label for="inf${ix}">Dawka</label><input id="inf${ix}" data-ix="${ix}" type="number" step="any" inputmode="decimal" value="${i.dose}"><span>${i.du}</span><output id="out${ix}">${fmt(infRate(i),1)} ml/h</output></div>`).join('')+'</div>';}
  const rest=listHTML(DRUGS.slice(3),q); if(!rest.startsWith('<p'))h+=rest;
  h+=`<div class="warnbar">Dawki orientacyjne dla dorosłych. Zawsze weryfikuj z ChPL, lokalnymi protokołami i aktualnymi wytycznymi ERC.</div>`;
  V().innerHTML=h; bindLm();
  $('#q').oninput=e=>{q=e.target.value;renderLeki();const n=$('#q');n.focus();n.setSelectionRange(q.length,q.length)};
  document.querySelectorAll('.infuse input').forEach(inp=>inp.oninput=e=>{const i=INF[+e.target.dataset.ix];i.dose=parseFloat(e.target.value.replace(',','.'))||0;$('#out'+e.target.dataset.ix).textContent=fmt(infRate(i),1)+' ml/h'});
}
function bindLm(){document.querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{lekiMode=b.dataset.lm;store.set('lm',lekiMode);renderLeki()})}

/* ===== LEKI: dzieci ===== */
let age=store.get('age',4), useAgeWt=true;
const VITALS=[['< 1 r.ż.','110–160','30–40','70–90'],['1–2 lata','100–150','25–35','80–95'],['2–5 lat','95–140','25–30','80–100'],['5–12 lat','80–120','20–25','90–110'],['> 12 lat','60–100','15–20','100–120']];
function estWt(a){if(a<1)return 5; if(a<=10)return (a+4)*2; return a*3+7}
function pedHTML(){
  const w=useAgeWt?estWt(age):kg;
  const ett=age>=1?[age/4+3.5,age/4+4]:[3.5,4];
  const K=[
   ['Masa (szac.)',fmt(w),'kg'],['Defibrylacja','4 J/kg = '+fmt(4*w),'J'],
   ['Adrenalina NZK',fmt(10*w)+' µg','= '+fmt(0.1*w,1)+' ml 1:10 000'],['Amiodaron',fmt(Math.min(5*w,300)),'mg (5 mg/kg)'],
   ['Rurka z mank.',fmt(ett[0],1),'mm ID'],['Głębokość',fmt((age>=1?age/2+12:10),1),'cm (ustna)'],
   ['Bolus płynów',fmt(10*w),'ml (10 ml/kg)'],['Glukoza 10%',fmt(2*w),'ml (2 ml/kg)']];
  const D=[
   ['Adrenalina i.m. (anafilaksja)',Math.min(0.01*w,0.5),'mg','0,01 mg/kg, maks. 0,5 mg'],
   ['Adenozyna – 1. dawka',Math.min(0.15*w,6),'mg','0,15 mg/kg (ERC), maks. 6 mg; kolejne 0,3 mg/kg, maks. 12 mg'],
   ['Atropina',Math.min(Math.max(0.02*w,0.1),0.5),'mg','0,02 mg/kg; min. 0,1 mg, maks. 0,5 mg'],
   ['Midazolam podpoliczkowo',Math.min(0.3*w,10),'mg','0,3 mg/kg, maks. 10 mg'],
   ['Lorazepam i.v.',Math.min(0.1*w,4),'mg','0,1 mg/kg, maks. 4 mg'],
   ['Ketamina (indukcja)',2*w,'mg','1–2 mg/kg'],
   ['Rokuronium',1*w,'mg','1 mg/kg'],
   ['Nalokson',0.01*w,'mg','0,01 mg/kg i.v.; przy braku odpowiedzi 0,1 mg/kg'],
   ['Paracetamol i.v.',Math.min(15*w,1000),'mg','15 mg/kg'],
   ['Ibuprofen p.o.',Math.min(10*w,400),'mg','10 mg/kg'],
   ['Deksametazon (krup)',Math.min(0.15*w,10),'mg','0,15 mg/kg p.o.'],
   ['Salbutamol (nebulizacja)',age<5?2.5:5,'mg','2,5 mg < 5 r.ż. / 5 mg ≥ 5 r.ż.'],
   ['Ceftriakson',Math.min(80*w,4000),'mg','80 mg/kg (sepsa / ZOMR)'],
   ['Glukagon (hipoglikemia)',w<25?0.5:1,'mg','0,5 mg < 25 kg, 1 mg ≥ 25 kg i.m.']];
  return `
  <div class="age"><label for="age">Wiek</label><select id="age">${Array.from({length:15},(_,i)=>`<option value="${i}" ${i===age?'selected':''}>${i===0?'< 1 rok':i+(i===1?' rok':i<5?' lata':' lat')}</option>`).join('')}</select>
  <label class="chk" style="border:0;padding:0"><input type="checkbox" id="usekg" ${useAgeWt?'':'checked'}><span>Użyj masy z nagłówka (${fmt(kg)} kg)</span></label></div>
  <div class="kv">${K.map(([k,v,u])=>`<div><div class="k">${k}</div><div class="v">${v} <small>${u}</small></div></div>`).join('')}</div>
  <div class="sub">Leki</div>
  <div class="list">${D.map(([n,v,u,m])=>`<div class="row"><div class="n">${n}</div><div class="d">${fmt(v)} ${u}</div><div class="m">${m}</div></div>`).join('')}</div>
  <div class="sub">Parametry życiowe</div>
  <div class="tbl"><table><thead><tr><th>Wiek</th><th>HR /min</th><th>RR /min</th><th>SBP mmHg</th></tr></thead><tbody>${VITALS.map(r=>`<tr>${r.map(c=>`<td>${c}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
  <p class="note">Masa szacunkowa wg APLS: (wiek + 4) × 2 dla 1–10 lat, wiek × 3 + 7 powyżej 10 lat. Rurka bez mankietu: wiek/4 + 4. Zawsze preferuj zmierzoną masę lub taśmę Broselowa.</p>
  <div class="warnbar">Dawki orientacyjne. Zawsze weryfikuj z ChPL, PALS/EPLS i lokalnymi protokołami.</div>`;
}
function bindPed(){
  $('#age').onchange=e=>{age=+e.target.value;store.set('age',age);renderLeki()};
  $('#usekg').onchange=e=>{useAgeWt=!e.target.checked;renderLeki()};
}

/* ===== SKALE ===== */
const SCORES={
 gcs:{n:'GCS',type:'sel',items:[
  {q:'Otwieranie oczu (E)',o:[['Spontaniczne',4],['Na głos',3],['Na ból',2],['Brak',1]]},

  {q:'Odpowiedź ruchowa (M)',o:[['Spełnia polecenia',6],['Lokalizuje ból',5],['Ucieczka od bólu',4],['Zgięcie patologiczne',3],['Wyprost',2],['Brak',1]]}],

  interp:s=>s>4?['crit','ZTP prawdopodobna','> 4 pkt — angio-TK']:['ok','ZTP mało prawdopodobna','≤ 4 pkt — D-dimery; rozważ PERC']},

  interp:s=>s===0?['ok','PERC ujemny','Wszystkie kryteria negatywne — ZTP wykluczona bez D-dimerów']:['warn','PERC dodatni','≥ 1 kryterium — wykonaj D-dimery']},
 heart:{n:'HEART',type:'sel',items:[
  {q:'Wywiad (History)',o:[['Mało podejrzany',0],['Umiarkowanie',1],['Wysoce podejrzany',2]]},
  {q:'EKG',o:[['Prawidłowe',0],['Niespecyficzne zmiany repolaryzacji',1],['Istotne obniżenie ST',2]]},
  {q:'Wiek (Age)',o:[['< 45',0],['45–64',1],['≥ 65',2]]},
  {q:'Czynniki ryzyka',o:[['Brak',0],['1–2',1],['≥ 3 lub znana miażdżyca',2]]},

let cur='gcs'; const st={};
function renderSkale(){
  const S=SCORES[cur]; st[cur]=st[cur]||{};
  let h=`<div class="seg">${Object.entries(SCORES).map(([k,v])=>`<button data-sc="${k}" aria-pressed="${k===cur}">${v.n}</button>`).join('')}</div><h2>${S.n}</h2>`;
  if(S.note)h+=`<p class="note" style="margin-top:0">${S.note}</p>`;
  h+='<div class="card">';
  if(S.type==='sel') S.items.forEach((it,i)=>{h+=`<div class="item"><div class="q">${it.q}</div><div class="opts">${it.o.map(([t,p])=>`<button class="opt" data-i="${i}" data-p="${p}" aria-pressed="${st[cur][i]===p}">${t} <b>${p}</b></button>`).join('')}</div></div>`});
  else S.items.forEach(([t,p],i)=>{h+=`<label class="chk"><input type="checkbox" id="c-${cur}-${i}" data-i="${i}" data-p="${p}" ${st[cur][i]!=null?'checked':''}><span>${t}</span><span class="pts">+${String(p).replace('.',',')}</span></label>`});
  h+=`</div><button class="reset" id="rst">Wyczyść</button><div class="result" id="res"></div>`;
  V().innerHTML=h; updScore();
  document.querySelectorAll('[data-sc]').forEach(b=>b.onclick=()=>{cur=b.dataset.sc;renderSkale()});
  document.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{st[cur][b.dataset.i]=+b.dataset.p;renderSkale()});
  document.querySelectorAll('.chk input').forEach(c=>c.onchange=()=>{if(c.checked)st[cur][c.dataset.i]=+c.dataset.p;else delete st[cur][c.dataset.i];updScore()});
  $('#rst').onclick=()=>{st[cur]={};renderSkale()};
}
function updScore(){
  const S=SCORES[cur],vals=Object.values(st[cur]),s=vals.reduce((a,b)=>a+b,0), r=$('#res');
  if(S.type==='sel'&&vals.length<S.items.length){r.className='result';r.innerHTML=`<div class="sc">${fmt(s)}</div><div class="t">Uzupełnij wszystkie pola</div><div class="x">Wybrano ${vals.length} z ${S.items.length}</div>`;return}
  const [lv,t,x]=S.interp(s);
  r.className='result lv-'+lv; r.innerHTML=`<div class="sc">${String(s).replace('.',',')}</div><div class="t">${t}</div><div class="x">${x}</div>`;
}

const TOXSEG={anti:'Antidota',nac:'Paracetamol',fab:'Digoksyna',tdr:'Toksydromy',hd:'Hemodializa'};
function renderTox(){
  let h=`<div class="seg">${Object.entries(TOXSEG).map(([k,v])=>`<button data-tx="${k}" aria-pressed="${k===tox}">${v}</button>`).join('')}</div>`;
  if(tox==='anti'){
    h+=`<input class="search" id="tq" type="search" placeholder="Filtruj antidota…" value="${tq}">`+listHTML(TOX,tq)+`<div class="warnbar">Dawki HIET, oksymów i emulsji tłuszczowej opierają się na konsensusach o niskiej jakości dowodów. Skonsultuj się z ośrodkiem toksykologicznym.</div>`;
    V().innerHTML=h; bindTx();
    $('#tq').oninput=e=>{tq=e.target.value;renderTox();const n=$('#tq');n.focus();n.setSelectionRange(tq.length,tq.length)};return;
  }
  if(tox==='tdr'){
    h+=`<div class="tox">`+TOXID.map(([n,p,s,k])=>`<div class="card"><h3>${n}</h3><span class="pill">Źrenice: ${p}</span><span class="pill">Skóra: ${s}</span><div class="note" style="margin-top:2px;color:var(--fg)">${k}</div></div>`).join('')+`</div><p class="note">Sympatykomimetyczny i antycholinergiczny odróżnisz po skórze: wilgotna kontra sucha.</p>`;
    V().innerHTML=h; bindTx(); return;
  }
  if(tox==='hd'){
    h+=`<h2>Wskazania do hemodializy (EXTRIP)</h2><div class="list">`+EXTRIP.map(([n,t])=>`<div class="row"><div class="n">${n}</div><div class="m" style="color:var(--fg)">${t}</div></div>`).join('')+`</div><p class="note">Źródło: extrip-workgroup.org. Stężenia litu w mmol/l = mEq/l.</p>`;
    V().innerHTML=h; bindTx(); return;
  }
  if(tox==='nac') h+=calcForm('nac'); else h+=calcForm('fab');
  V().innerHTML=h; bindTx(); bindCalc(tox);
}

  if(na<135){
    o+=ln(na<125?'crit':'warn',na<125?'Hiponatremia głęboka (< 125)':na<130?'Hiponatremia umiarkowana (125–129)':'Hiponatremia łagodna (130–134)','');
    o+=ln('crit','Ciężkie objawy (ESE/ESICM/ERBP 2014)','150 ml 3% NaCl i.v. w 20 min, kontrola Na⁺, powtórz 2× lub do wzrostu o 5 mmol/l. Szacowany wzrost po 150 ml: +'+fmt(ad(513)*0.15,1)+' mmol/l. W USA bolus 100 ml w 10 min.');
    o+=ln('warn','Limit korekcji','≤ 10 mmol/l w pierwszej dobie (≤ 8 przy wysokim ryzyku ODS: alkoholizm, niedożywienie, hipokaliemia), potem ≤ 8 mmol/l na dobę.','maks. '+fmt(na+10,0)+' mmol/l po 24 h');
  } else if(na>145){
    const def=tbw*(na/140-1);
    o+=ln(na>160?'crit':'warn','Hipernatremia','Tempo korekcji ≤ 10 mmol/l na dobę; w przewlekłej ok. 0,5 mmol/l/h.');
    o+=ln('info','Deficyt wolnej wody','TBW × (Na⁺ / 140 − 1)',fmt(def,1)+' l');
  } else o+=ln('ok','Na⁺ w normie (135–145)','');
  return o;},
 k(){
  const k=num('k_k'),e=cs.k_ekg==='1',g=num('k_glu');
  if(!k)return ln('info','Wpisz K⁺');
  let o='';
  if(k>=5.5){
    const lv=k>=6.5?['crit','Hiperkaliemia ciężka (≥ 6,5)']:k>=6?['warn','Hiperkaliemia umiarkowana (6,0–6,4)']:['warn','Hiperkaliemia łagodna (5,5–5,9)'];
    o+=ln(lv[0],lv[1],'Progi wg ERC 2025. EKG: szpiczaste T → zanik P → poszerzenie QRS → sinusoida → VF/asystolia.');
    if(e||k>=6.5)o+=ln('crit','Ochrona mięśnia sercowego','Chlorek wapnia 10% 10 ml i.v. w 5 min lub glukonian wapnia 10% 30 ml i.v. w 10 min.');
    if(k>=6)o+=ln('crit','Przesunięcie do komórek','Insulina 10 j. + 25 g glukozy i.v.'+(isFinite(g)&&g<7?' Glikemia < 7 mmol/l: dodatkowo glukoza 10% 50 ml/h przez 5 h.':' Kontroluj glikemię przez 6 h.')+(k>=6.5?' Dodaj salbutamol 10–20 mg w nebulizacji.':''));
    o+=ln('info','Usuwanie potasu','Cyklokrzemian sodowo-cyrkonowy 10 g p.o. (patiromer działa wolniej). Hemodializa przy oporności. NaHCO₃ nie rutynowo poza NZK.');
  } else if(k<3.5){
    const lv=k<2.5?['crit','Hipokaliemia ciężka (< 2,5)']:k<3?['warn','Hipokaliemia umiarkowana (2,5–2,9)']:['warn','Hipokaliemia łagodna (3,0–3,4)'];
    o+=ln(lv[0],lv[1],'');
    o+=ln('info','Suplementacja i.v.','Standardowo 10 mmol/h, maks. 20 mmol/h. Dostęp obwodowy: stężenie ≤ 40 mmol/l; szybciej tylko centralnie z monitorowaniem EKG. Uzupełnij magnez.');
    o+=ln('crit','NZK z hipokaliemii (ERC 2025)','20 mmol KCl i.v. w 2–3 min, następnie 10 mmol w 2 min.');
  } else o+=ln('ok','K⁺ w normie (3,5–5,4)','');
  return o;},
 ca(){
  const c=num('c_ca'),a=num('c_alb'),m=num('c_mg');let o='';
  if(c&&isFinite(a)){const cc=c+0.02*(40-a);
    o+=ln(cc<2.1||cc>2.6?'warn':'ok','Wapń skorygowany na albuminę','Ca + 0,02 × (40 − albumina g/l). Norma 2,1–2,6 mmol/l.',fmt(cc,2)+' mmol/l');
    if(cc<2.1)o+=ln('crit','Hipokalcemia objawowa','Tężyczka, drgawki, wydłużony QT: glukonian wapnia 10% 10–20 ml i.v. w 10 min, następnie wlew.');
    if(cc>2.6)o+=ln(cc>3.5?'crit':'warn','Hiperkalcemia'+(cc>3.5?' — przełom':''),'0,9% NaCl 200–300 ml/h; kwas zoledronowy 4 mg lub pamidronian 60–90 mg i.v. (efekt po 2–4 dniach); kalcytonina 4 j./kg co 12 h (szybki, krótki efekt); hemodializa w przełomie lub niewydolności nerek.');
  } else o+=ln('info','Wpisz wapń i albuminę','');
  if(m){o+=ln(m<0.7?'warn':'ok',m<0.7?'Hipomagnezemia':'Magnez w normie (0,7–1,0 mmol/l)',m<0.7?'Objawowa lub ciężka: siarczan magnezu 2 g (8 mmol) i.v. w 15 min, następnie wlew. Torsade de pointes: 2 g i.v. w bolusie.':'');}
  return o;},
 egfr(){
  const a=num('e_age'),f=cs.e_sex==='K',s=num('e_scr'),mg=cs.e_u==='mg';
  if(!(a&&s))return ln('info','Uzupełnij wiek i kreatyninę');
  const sMg=mg?s:s/88.4, sUm=mg?s*88.4:s;
  const cg=(140-a)*kg*(f?1.04:1.23)/sUm;
  const kp=f?0.7:0.9, al=f?-0.241:-0.302, r=sMg/kp;
  const egfr=142*Math.pow(Math.min(r,1),al)*Math.pow(Math.max(r,1),-1.2)*Math.pow(0.9938,a)*(f?1.012:1);
  const G=egfr>=90?'G1':egfr>=60?'G2':egfr>=45?'G3a':egfr>=30?'G3b':egfr>=15?'G4':'G5';
  return ln(cg<30?'crit':cg<60?'warn':'ok','Klirens kreatyniny (Cockcroft-Gault)','Do dawkowania leków. Używa masy z nagłówka; przy otyłości rozważ masę należną.',fmt(cg,0)+' ml/min')
   +ln(egfr<30?'crit':egfr<60?'warn':'ok','eGFR CKD-EPI 2021 — kategoria '+G,'Wzór bez rasy (Inker 2021). Do oceny przewlekłej choroby nerek.',fmt(egfr,0)+' ml/min/1,73 m²');},
 dka(){
  const g=num('d_glu'),ph=num('d_ph'),h=num('d_hco'),b=num('d_bohb'),k=num('d_k'),os=num('d_osm'),dm=cs.d_dm==='1';
  let o='';
  const D=g>=11.1||dm, K=b>=3, A=(ph<7.3)||(h<18);
  const kr=(x,t)=>(x?'✓ ':'✗ ')+t;
  o+=ln(D&&K&&A?'crit':'ok',D&&K&&A?'Kryteria DKA spełnione':'Kryteria DKA niespełnione',[kr(D,'glukoza ≥ 11,1 mmol/l lub znana cukrzyca'),kr(K,'β-OHB ≥ 3,0 mmol/l'),kr(A,'pH < 7,3 lub HCO₃⁻ < 18 mmol/l')].join('<br>'));
  if(D&&K&&A){
    const sev=(ph<7||h<10||b>6)?['crit','Ciężka']:(ph<=7.25||h<15)?['warn','Umiarkowana']:['warn','Łagodna'];
    o+=ln(sev[0],'Ciężkość: '+sev[1],'Ciężka: pH < 7,0, HCO₃⁻ < 10 lub β-OHB > 6. Umiarkowana: pH 7,0–7,25, HCO₃⁻ 10–15.');
    o+=ln('info','Wlew insuliny 0,1 j./kg/h','Rozpocznij po płynach i gdy K⁺ ≥ 3,5. Płyny 500–1000 ml/h przez 2–4 h.',fmt(0.1*kg,1)+' j./h');
    if(isFinite(k))o+=ln(k<3.5?'crit':k>5.5?'warn':'ok','Potas: '+fmt(k,1)+' mmol/l',k<3.5?'Wstrzymaj insulinę, uzupełniaj K⁺ do > 3,5 mmol/l.':k>5.5?'Bez suplementacji K⁺, kontrola co 2 h.':'Dodaj 40 mmol KCl na każdy litr płynów (cel 4–5 mmol/l).');
    if(isFinite(g)&&g<14)o+=ln('warn','Glikemia < 14 mmol/l','Dodaj glukozę 10% 125 ml/h; rozważ insulinę 0,05 j./kg/h ('+fmt(0.05*kg,1)+' j./h).');
    o+=ln('info','Ustąpienie DKA','β-OHB < 0,6 mmol/l oraz pH > 7,3 lub HCO₃⁻ > 18 mmol/l.');
  }
  const hhs=g>=33.3&&(!isFinite(b)||b<3)&&(!isFinite(ph)||ph>=7.3)&&(!isFinite(os)||os>300);
  if(g>=33.3)o+=ln(hhs?'crit':'info',hhs?'Obraz zgodny z HHS':'Kryteria HHS','Glukoza ≥ 33,3 mmol/l, osmolalność efektywna > 300 mOsm/kg, β-OHB < 3, pH ≥ 7,3, HCO₃⁻ ≥ 15. Insulina 0,05 j./kg/h dopiero po płynach; spadek glukozy ≤ 5 mmol/l/h, Na⁺ ≤ 10 mmol/l na dobę.');
  return o;},
 nac(){
  const t=num('p_t'); let c=num('p_c'); if(cs.p_u==='umol')c=c/6.62;
  const w=Math.min(kg,110); let o='';
  if(isFinite(t)&&isFinite(c)){
    if(t<4)o+=ln('warn','Za wcześnie na interpretację','Pobierz stężenie ≥ 4 h od przyjęcia.');
    else if(t>24)o+=ln('warn','Nomogram nie dotyczy (> 24 h)','Lecz przy wykrywalnym paracetamolu lub podwyższonym ALT.');
    else{
      const uk=100*Math.pow(2,-(t-4)/4), us=150*Math.pow(2,-(t-4)/4);
      const lv=c>=uk?(c>=us?['crit','Powyżej linii 100 i 150 — podaj NAC']:['crit','Powyżej linii 100 (UK/MHRA) — podaj NAC','Poniżej amerykańskiej linii 150.']):['ok','Poniżej linii leczenia','Przy jednorazowym przyjęciu ze znanym czasem NAC zwykle niewskazana.'];
      o+=ln(lv[0],lv[1],(lv[2]?lv[2]+' ':'')+'Linia 100 w '+fmt(t,1)+' h: '+fmt(uk,0)+' mg/l · linia 150: '+fmt(us,0)+' mg/l.',fmt(c,0)+' mg/l');
    }
  }
  o+=ln('warn','Lecz bez czekania na stężenie','Przyjęcie rozłożone w czasie, nieznany czas lub zgłoszenie > 8 h od przyjęcia dawki potencjalnie toksycznej (> 75 mg/kg). Nomogram nie dotyczy tych sytuacji.');
  o+=ln('info','Schemat SNAP (12 h)','Worek 1: 100 mg/kg w 2 h = '+fmt(100*w/1000,1)+' g. Worek 2: 200 mg/kg w 10 h = '+fmt(200*w/1000,1)+' g. Mniej reakcji rzekomoanafilaktycznych.');
  o+=ln('info','Schemat klasyczny (21 h)','150 mg/kg w 1 h = '+fmt(150*w/1000,1)+' g → 50 mg/kg w 4 h = '+fmt(50*w/1000,1)+' g → 100 mg/kg w 16 h = '+fmt(100*w/1000,1)+' g.');
  o+=ln('info','Kiedy przerwać','Paracetamol < 10 mg/l, ALT w normie, INR < 1,3 i brak objawów.');
  return o+`<p class="note">Masa do obliczeń: ${fmt(w)} kg (limit 110 kg). 1 mg/l = 6,62 µmol/l.</p>`;},
 fab(){
  const m=cs.f_mode, mg=num('f_mg'), c=num('f_c'); let v=null, how='';
  if(m==='acute'&&mg){v=Math.ceil(mg*0.8/0.5);how='(mg × 0,8) / 0,5';}
  if(m==='chronic'&&c){v=Math.ceil(c*kg/100);how='(stężenie ng/ml × masa kg) / 100';}
  if(m==='acuteU'){v=10;how='10 fiolek, obserwacja, w razie potrzeby kolejne 10';}
  if(m==='chronicU'){v=kg<20?1:6;how=kg<20?'Dziecko < 20 kg: 1 fiolka':'Dorośli i dzieci ≥ 20 kg: 6 fiolek';}
  let o=v!=null?ln('crit','Liczba fiolek (40 mg; każda wiąże 0,5 mg digoksyny)',how,v+' fiol.'):ln('info','Uzupełnij dane','');
  return o+ln('info','Wskazania','Zagrażające życiu arytmie; bradykardia lub blok oporne na atropinę; K⁺ > 5,0–5,5 mmol/l w ostrym zatruciu; stężenie > 15 ng/ml lub > 10 ng/ml po 6 h; przyjęcie > 10 mg (dorośli) lub > 4 mg (dziecko).');}
};
function bindCalc(k){
  const run=()=>{const o=$('#out');if(o)o.innerHTML=COMPUTE[k]()};
  V().querySelectorAll('[data-f]').forEach(el=>{
    const ev=()=>{cs[el.dataset.f]=el.value;store.set('cs',cs);
      if(el.tagName==='SELECT'&&/_u$/.test(el.dataset.f)){R[tab]();return}
      run()};
    el.oninput=ev; if(el.tagName==='SELECT')el.onchange=ev;});
  run();
}
function renderCalc(){
  V().innerHTML=`<div class="seg">${Object.entries(CALCSEG).map(([k,v])=>`<button data-cl="${k}" aria-pressed="${k===calc}">${v}</button>`).join('')}</div>`+calcForm(calc)+`<div class="warnbar">Kalkulatory wspierają decyzję, ale jej nie zastępują. Wyniki interpretuj w kontekście klinicznym.</div>`;
  document.querySelectorAll('[data-cl]').forEach(b=>b.onclick=()=>{calc=b.dataset.cl;store.set('calc',calc);renderCalc()});
  bindCalc(calc);
  const a=V().querySelector('[aria-pressed="true"]');if(a)a.scrollIntoView({block:'nearest',inline:'center'});
}

/* ===== WYSZUKIWARKA ===== */
const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/ł/g,'l');
const IDX=[];
DRUGS.forEach(g=>g.items.forEach(i=>IDX.push({l:i.n,s:'Leki · '+g.g,f:()=>{lekiMode='dor';q=i.n;go('leki')}})));
INF.forEach(i=>IDX.push({l:i.n+' (wlew)',s:'Leki · Wlewy ciągłe',f:()=>{lekiMode='dor';q=i.n;go('leki')}}));
IDX.push({l:'Pediatria',k:'dzieci dziecko rurka broselow',s:'Leki · Dzieci',f:()=>{lekiMode='dz';go('leki')}});
Object.entries(SCORES).forEach(([k,v])=>IDX.push({l:v.n,s:'Skale',f:()=>{cur=k;go('skale')}}));
Object.entries(ALGO).forEach(([k,v])=>IDX.push({l:v.t,s:'Stany · Algorytmy',f:()=>{ca=k;algoMode='algo';go('algo')}}));
STN.forEach((s,i)=>IDX.push({l:s.n,k:s.k,s:'Rozpoznanie · '+s.c,f:()=>{algoMode='rozp';stOpen=i;go('algo')}}));
OBJR.forEach((o,i)=>IDX.push({l:o.n,k:o.k,s:'Objaw · '+o.c,f:()=>{algoMode='obj';obOpen=i;go('algo')}}));
TOX.forEach(g=>g.items.forEach(i=>IDX.push({l:i.n,s:'Zatrucia · '+g.g,f:()=>{tox='anti';tq=i.n;go('tox')}})));
const KW={nac:'acetylocysteina nomogram snap paracetamol',fab:'digifab digoksyna',tdr:'toksydromy cholinergiczny antycholinergiczny',hd:'extrip dializa lit salicylany metanol'};
Object.entries(TOXSEG).filter(([k])=>k!=='anti').forEach(([k,v])=>IDX.push({l:v,k:KW[k],s:'Zatrucia',f:()=>{tox=k;go('tox')}}));
const CKW={gas:'gazometria winters luka anionowa delta ph kwasica zasadowica',osm:'osmolalnosc metanol glikol',oxy:'gradient a-a ards pao2 fio2 horowitz',na:'hiponatremia hipernatremia adrogue deficyt wody',k:'hiperkaliemia hipokaliemia potas',ca:'wapn hiperkalcemia hipokalcemia magnez',egfr:'cockcroft ckd-epi gfr klirens kreatynina',dka:'kwasica ketonowa hhs insulina'};
Object.entries(CALCSEG).forEach(([k,v])=>IDX.push({l:v,k:CKW[k],s:'Kalkulatory',f:()=>{calc=k;go('calc')}}));
$('#sbtn').onclick=()=>{const b=$('#sbox'),open=b.hidden;b.hidden=!open;$('#sbtn').setAttribute('aria-expanded',open);if(open){$('#sq').value='';$('#sres').innerHTML='';$('#sq').focus()}};
$('#sq').oninput=e=>{
  const v=norm(e.target.value.trim()); const r=$('#sres');
  if(v.length<2){r.innerHTML='';return}
  const sc=x=>{const n=norm(x.l);return n.startsWith(v)?0:n.includes(v)?1:norm(x.k||'').includes(v)?2:3};
  const hits=IDX.filter(x=>norm(x.l+' '+(x.k||'')+' '+x.s).includes(v)).sort((a,b)=>sc(a)-sc(b)).slice(0,15);
  r.innerHTML=hits.length?hits.map((x,i)=>`<button data-h="${IDX.indexOf(x)}">${x.l}<small>${x.s}</small></button>`).join(''):'<button disabled>Brak wyników<small>Spróbuj innej nazwy</small></button>';
  r.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{IDX[+b.dataset.h].f();$('#sbox').hidden=true;$('#sbtn').setAttribute('aria-expanded',false)});
};

/* ===== NAWIGACJA ===== */
let tab=store.get('tab','leki');
const R={leki:renderLeki,skale:renderSkale,algo:renderAlgo,tox:renderTox,calc:renderCalc};
function go(t){tab=R[t]?t:'leki';store.set('tab',tab);document.querySelectorAll('nav button').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===tab));R[tab]();window.scrollTo(0,0)}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{if(b.dataset.tab==='leki')q='';if(b.dataset.tab==='tox')tq='';go(b.dataset.tab)});
function setKg(v){kg=v;store.set('kg',kg);
  const o=$('#out');
  if((tab==='calc'||tab==='tox')&&o){o.innerHTML=COMPUTE[tab==='calc'?calc:tox]?COMPUTE[tab==='calc'?calc:tox]():o.innerHTML;document.querySelectorAll('main .note').forEach(n=>{if(n.textContent.startsWith('Masa ciała z nagłówka'))n.textContent='Masa ciała z nagłówka: '+fmt(kg)+' kg.'})}
  else R[tab]()}
$('#kg').oninput=e=>{const v=parseFloat(e.target.value.replace(',','.'));if(v>0&&v<400)setKg(v)};
$('#kgchips').innerHTML=[50,60,70,80,100].map(v=>`<button class="chip" data-kg="${v}">${v}</button>`).join('');
document.querySelectorAll('[data-kg]').forEach(b=>b.onclick=()=>{$('#kg').value=b.dataset.kg;setKg(+b.dataset.kg)});
/* przycisk „wstecz” w aplikacji Android */
window.sorBack=function(){
  if(!$('#sbox').hidden){$('#sbox').hidden=true;$('#sbtn').setAttribute('aria-expanded',false);return true}
  if(tab==='algo'&&obOpen!=null){obOpen=null;renderAlgo();return true}
  if(tab==='algo'&&stOpen!=null){stOpen=null;renderAlgo();return true}
  if(tab!=='leki'){go('leki');return true}
  return false};
go(tab);
</script>
