function mk(){const r={out:[],msg:[],val:{},fx:'',src:[],act:[]};

function needW(p,r){

  if(p.w<0.4||p.w>300){r.m('stop','Masa ciała poza zakresem 0,4–300 kg. Sprawdź wpis.');return false}
  if(p.w>250)r.m('warn','Masa >250 kg — upewnij się, że wpis jest poprawny.');
  return true}
function needNa(na,r,lab='Na⁺'){

 <li><b>Niewydolność serca:</b> bolusy 250 ml (dorośli) / 5 ml/kg (dzieci), ocena po każdym; podtrzymanie 20–25 ml/kg/d.</li>

 <li><b>Obrzęk płuc, SpO₂ ↓ po bolusie, nowe linie B:</b> STOP płynom.</li>
 <li><b>TBI:</b> 0,9% NaCl; bez hipotensji permisywnej; MAP ≥80 mmHg.</li>
 <li><b>Preeklampsja:</b> płyny ≤80 ml/h bez innych strat; bez rutynowych bolusów przed znieczuleniem przewodowym.</li>
 <li><b>Dzieci:</b> tylko izotoniczne płyny podtrzymujące; Na⁺ co ≥24 h; przy ryzyku SIADH 50–80% zapotrzebowania.</li>
 <li><b>Ciężkie niedożywienie u dziecka:</b> standardowe bolusy niebezpieczne — protokół WHO.</li>
 <li><b>DKA u dziecka:</b> bez bolusów >20 ml/kg bez ponownej oceny; ocena neurologiczna co 1 h.</li></ul></div>

function runTests(){return TESTS.map(([id,name,fn,exp])=>{let got,ok=false,err='';try{got=fn();ok=got.length===exp.length&&got.every((g,i)=>{const e=exp[i];return Math.abs(g-e)<=Math.max(0.005*Math.abs(e),0.011)})}catch(e){err=e.message;got=[]}return{id,name,got,exp,ok,err}})}
function testPage(){const res=runTests();const n=res.filter(r=>r.ok).length;
 return `<div class="doc"><h3>Autotest obliczeń</h3><p class="lead">Przypadki kontrolne z raportu (T1–T45), test tabeli Lund-Browder, odwodnienia z panelu pacjenta, przetoczeń, walidacji danych pacjenta i wstrząsu. Tolerancja ±0,5%. Uruchamiane na tym urządzeniu przy każdym otwarciu.</p>
 <div class="m ${n===res.length?'ok':'stop'}"><span class="k">${n===res.length?'OK':'BŁĄD'}</span><span>${n} / ${res.length} testów zaliczonych</span></div>
 <div class="tw"><table><thead><tr><th>#</th><th>Test</th><th>Oczekiwane</th><th>Wynik</th><th></th></tr></thead><tbody>${res.map(r=>`<tr><td>${r.id}</td><td>${r.name}</td><td>${r.exp.map(x=>f(x,2)).join(' · ')}</td><td>${r.err||r.got.map(x=>f(x,2)).join(' · ')}</td><td class="${r.ok?'pass':'fail'}">${r.ok?'✓':'✗'}</td></tr>`).join('')}</tbody></table></div></div>`}

/* ================= UI ================= */
const $=s=>document.querySelector(s);let tab='kalk',query='',cur=null;
function defaults(c){const v={};if(Array.isArray(c.inp))c.inp.forEach(i=>{if(i[0]==='chk')v[i[1]]=false;else v[i[1]]=i[0]==='sel'?(i[4]??i[3][0][0]):(i[4]??'')});if(c.inp==='lb')LBREG.forEach((_,i)=>v['lb'+i]='0');return v}
function vals(c){if(!V[c.id])V[c.id]=defaults(c);return V[c.id]}
function esc(s){return String(s).replace(/[&<>"]/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]))}
function ptSummary(){const p=pat();const parts=[Number.isFinite(p.w)||Number.isFinite(p.ageY)?GRPN[p.grp]:'brak danych — wpisz masę i wiek'];if(Number.isFinite(p.w))parts.push(f(p.w,1)+' kg');if(Number.isFinite(p.ageY))parts.push(P.age+' '+({l:'l.',m:'mies.',d:'dni'}[P.ageU]));parts.push(P.sex==='M'?'M':'K');if(Number.isFinite(p.h))parts.push(f(p.h)+' cm');else if(num(P.h)>0)parts.push('wzrost ✗');if(Number.isFinite(p.bmi))parts.push('BMI '+f(p.bmi,1));
 if(Number.isFinite(p.dehyd))parts.push(`odwodnienie ${DEHN[p.dehydG]} ${f(p.dehyd)}%`);if(p.shock)parts.push('WSTRZĄS '+SHOCK[p.shock].n);const fl=FLAGDEF.filter(([k])=>P.flags[k]).map(x=>x[1]);if(p.elderly)fl.unshift('≥65 lat');const el=$('#ptSum');if(el)el.textContent=parts.join(' · ')+(fl.length?' · '+fl.join(', '):'');const ex=$('#ptEx');if(ex)ex.hidden=!isExample;const ps=$('#ptShock');if(ps)ps.innerHTML=p.shock?`<div class="m stop"><span class="k">Wstrząs</span><span><b>${SHOCK[p.shock].n}:</b> ${SHOCK[p.shock].t} ${SHOCK[p.shock].go.map(id=>{const c=CALCS.find(x=>x.id===id);return c&&id!==cur?`<button class="btn sec" type="button" data-go="${id}" style="margin:6px 6px 0 0;padding:6px 10px;font-size:13px">${c.t} ›</button>`:''}).join('')}</span></div>`:'';const pw=$('#ptWarn');if(pw)pw.innerHTML=p.chk.map(t=>`<div class="m warn"><span class="k">Sprawdź</span><span>${t}</span></div>`).join('')}
function ptHtml(){const fl=FLAGDEF.map(([k,l])=>`<label class="chk${P.flags[k]?' on':''}"><input type="checkbox" data-flag="${k}" ${P.flags[k]?'checked':''}>${l}</label>`).join('');
 return `<details class="pt" id="pt"${ptOpen?' open':''}><summary><b>Pacjent</b><span class="sum" id="ptSum"></span><span class="pill ex" id="ptEx"${isExample?'':' hidden'}>przykład — wpisz swojego pacjenta</span></summary>
 <div class="body"><div class="grid2">
 <label class="f" for="p_w">Masa ciała<span class="row"><input class="n" id="p_w" data-p="w" inputmode="decimal" autocomplete="off" value="${esc(P.w??'')}"><span class="unit">kg</span></span></label>
 <label class="f" for="p_age">Wiek<span class="row"><input class="n" id="p_age" data-p="age" inputmode="decimal" autocomplete="off" value="${esc(P.age??'')}"><select id="p_ageU" data-p="ageU" style="max-width:90px">${[['l','lat'],['m','mies.'],['d','dni']].map(([a,b])=>`<option value="${a}"${P.ageU===a?' selected':''}>${b}</option>`).join('')}</select></span></label>
 <label class="f" for="p_sex">Płeć<select id="p_sex" data-p="sex"><option value="M"${P.sex==='M'?' selected':''}>mężczyzna / chłopiec</option><option value="K"${P.sex==='K'?' selected':''}>kobieta / dziewczynka</option></select></label>
 <label class="f" for="p_h">Wzrost<span class="row"><input class="n" id="p_h" data-p="h" inputmode="decimal" autocomplete="off" value="${esc(P.h??'')}"><span class="unit">cm</span></span></label>
 <label class="f" for="p_dehyd">Odwodnienie<select id="p_dehyd" data-p="dehyd">${[['','brak / nieoceniane'],['l','lekkie (niemowlę 5%, starsi 3%)'],['u','umiarkowane (niemowlę 10%, starsi 6%)'],['c','ciężkie (niemowlę 15%, starsi 9%)'],['pct','wpiszę % (np. z masy ciała)']].map(([a,b])=>`<option value="${a}"${(P.dehyd||'')===a?' selected':''}>${b}</option>`).join('')}</select></label>
 <label class="f" for="p_shock">Wstrząs<select id="p_shock" data-p="shock">${[['','brak'],...Object.entries(SHOCK).map(([k,o])=>[k,o.n])].map(([a,b])=>`<option value="${a}"${(P.shock||'')===a?' selected':''}>${b}</option>`).join('')}</select></label>
 <label class="f" for="p_dpct" id="p_dpctWrap"${P.dehyd==='pct'?'':' hidden'}>Odwodnienie %<span class="row"><input class="n" id="p_dpct" data-p="dehydPct" inputmode="decimal" autocomplete="off" value="${esc(P.dehydPct??'')}"><span class="unit">%</span></span></label>
 </div><div class="msgs" id="ptShock" style="margin-top:0"></div><div class="msgs" id="ptWarn" style="margin-top:0"></div><div class="flags">${fl}</div><div class="acts" style="margin-top:0"><button class="btn sec" id="ptClear" type="button">Wyczyść dane pacjenta</button></div></div></details>`}
let ptOpen=true;
function ptUpdate(t){const k=t.dataset&&t.dataset.p,fk=t.dataset&&t.dataset.flag;if(!k&&!fk)return false;if(!t.isConnected)return true;
 if(k){P[k]=t.value;if(k==='dehyd'){const wr=$('#p_dpctWrap');if(wr)wr.hidden=t.value!=='pct'}}if(fk){P.flags[fk]=t.checked;t.parentElement.classList.toggle('on',t.checked)}
 isExample=false;save();ptSummary();if(cur)compute();else if(k==='shock'){const sb=$('#shockBanner');if(sb)sb.innerHTML=shockBanner()}return true}
function inputHtml(c,i,v){const [t,k,l,u]=i;const id=`i_${c.id}_${k}`;
 if(t==='num')return `<label class="f" for="${id}">${l}<span class="row"><input class="n" id="${id}" data-k="${k}" inputmode="decimal" autocomplete="off" value="${esc(v[k])}">${u?`<span class="unit">${u}</span>`:''}</span></label>`;
 if(t==='sel')return `<label class="f" for="${id}">${l}<select id="${id}" data-k="${k}">${u.map(([a,b])=>`<option value="${a}"${String(v[k])===String(a)?' selected':''}>${b}</option>`).join('')}</select></label>`;
 if(t==='chk')return `<label class="chk${v[k]?' on':''}" style="grid-column:1/-1"><input type="checkbox" id="${id}" data-k="${k}"${v[k]?' checked':''}>${l}</label>`}
function lbHtml(c,v){const a=pat().ageY;return `<div class="lb">${LBREG.map((reg,i)=>{const id=`i_${c.id}_lb${i}`;const pc=Number.isFinite(a)?f(LBval(reg,a),2)+'%':'';return `<label class="f" for="${id}">${reg[0]} <span style="font-weight:500">${pc}</span><select id="${id}" data-k="lb${i}">${[0,25,50,75,100].map(x=>`<option value="${x}"${String(v['lb'+i])===String(x)?' selected':''}>${x===0?'—':x===100?'całość':x+'%'}</option>`).join('')}</select></label>`}).join('')}</div>`}
function shockBanner(){const pp=pat();if(!pp.shock)return '';return `<div class="msgs"><div class="m stop"><span class="k">Wstrząs</span><span><b>${SHOCK[pp.shock].n}</b> — polecane kalkulatory: ${SHOCK[pp.shock].go.map(id=>`<button class="btn sec" type="button" data-go="${id}" style="margin:6px 6px 0 0;padding:6px 10px;font-size:13px">${CALCS.find(x=>x.id===id).t} ›</button>`).join('')}</span></div></div>`}
function listView(){const q=query.trim().toLowerCase();let h=`<div class="tabs" role="tablist">${[['kalk','Kalkulatory'],['plyny','Skład płynów'],['bezp','Bezpieczeństwo'],['zmiany','Zmiany 2021–26'],['zrodla','Źródła'],['test','Autotest']].map(([k,l])=>`<button data-tab="${k}" aria-current="${tab===k}">${l}</button>`).join('')}</div>`;
 if(tab!=='kalk')return h+PAGES[tab].h();
 h+=`<div id="shockBanner">${shockBanner()}</div>`;
 h+=`<div class="search"><input class="n" id="q" placeholder="Szukaj: sód, oparzenia, potas, DKA…" value="${esc(query)}" style="font-family:var(--f-ui)" aria-label="Szukaj kalkulatora"></div>`;
 for(const [ck,[cn,col]] of Object.entries(CATS)){const items=CALCS.filter(c=>c.cat===ck&&(!q||(c.t+' '+c.d).toLowerCase().includes(q)));if(!items.length)continue;
  h+=`<h2 class="grp"><i style="background:var(${col})"></i>${cn}</h2><div class="list">${items.map(c=>`<button class="card" data-go="${c.id}" style="--cc:var(${col})"><span class="bar"></span><span class="t"><strong>${c.t}</strong><span>${c.d}</span></span></button>`).join('')}</div>`}
 return h}
function calcView(c){const v=vals(c);const col=CATS[c.cat][1];
 const inp=c.inp==='lb'?lbHtml(c,v):c.inp.length?`<div class="grid2">${c.inp.map(i=>inputHtml(c,i,v)).join('')}</div>`:'<p class="lead" style="margin:0">Obliczenia z danych pacjenta (u góry).</p>';
 return `<div style="--cc:var(${col})"><div class="calc-h"><span class="cat">${CATS[c.cat][0]}</span><h2>${c.t}</h2></div><p class="lead">${c.d}</p><div class="panel" id="inps">${inp}</div><div id="out"></div></div>`}
function resultHtml(c,r){let h='';
 if(r.out.length)h+=`<div class="res">${r.out.map(o=>`<div class="o${o.big?' big':''}"><span class="l">${o.l}</span><span class="v">${o.v}</span>${o.s?`<span class="s">${o.s}</span>`:''}</div>`).join('')}</div>`;
 const order={stop:0,warn:1,ok:2,info:3};const ms=[...r.msg].sort((a,b)=>order[a.lv]-order[b.lv]);
 if(ms.length)h+=`<div class="msgs">${ms.map(m=>`<div class="m ${m.lv}"><span class="k">${{stop:'Stop',warn:'Uwaga',info:'Info',ok:'OK'}[m.lv]}</span><span>${m.t}</span></div>`).join('')}</div>`;
 if(r.act.length)h+=`<div class="acts">${r.act.map((a,i)=>`<button class="btn${a.sec?' sec':''}" data-act="${i}">${a.l}</button>`).join('')}</div>`;
 h+=recHtml(c,pat());
 if(r.fx)h+=`<div class="fx"><b>Wzór</b><br><code>${r.fx}</code></div>`;
 if(r.src.length)h+=`<div class="src"><b>Źródła</b>${[...new Set(r.src)].map(srcLine).join('')}</div>`;return h}
let curR=null;
function compute(){const c=CALCS.find(x=>x.id===cur);if(!c||!$('#out'))return;const p=pat();const r=c.run.call(c,vals(c),p);
 p.chk.slice().reverse().forEach(t=>r.msg.unshift({lv:'warn',t:'Dane pacjenta: '+t}));
 if(isExample)r.msg.unshift({lv:'warn',t:'Liczę na DANYCH PRZYKŁADOWYCH (70 kg, 45 lat). Wpisz dane swojego pacjenta w panelu „Pacjent” powyżej.'});if(p.grp==='?'&&c.id!=='nacl3'&&c.id!=='krople'&&c.id!=='jednostki')r.msg.unshift({lv:'warn',t:'Brak wieku pacjenta — część dawek zależy od tego, czy to dziecko czy dorosły. Uzupełnij wiek.'});curR=r;const used=`<div class="fx" style="margin-top:0;margin-bottom:0"><b>Dane do obliczeń:</b> ${esc(document.getElementById('ptSum')?document.getElementById('ptSum').textContent:'')}</div>`;$('#out').innerHTML=`<div style="margin-top:12px">${used}</div>`+resultHtml(c,r)}
function refresh(){if(cur)compute();else render()}
function go(id){cur=CALCS.find(x=>x.id===id)?id:null;render();try{const h=cur?'#'+cur:' ';if(location.hash!==(cur?'#'+cur:''))history.pushState(null,'',h)}catch(e){}}
function render(){const c=CALCS.find(x=>x.id===cur);$('#btnBack').hidden=!c;
 if(c){$('#view').innerHTML=ptHtml()+calcView(c);ptSummary();compute();window.scrollTo(0,0)}else{$('#view').innerHTML=ptHtml()+listView();ptSummary();const q=$('#q');if(q&&query){q.focus();q.setSelectionRange(query.length,query.length)}}}
function onField(e){const t=e.target;if(!t||!t.isConnected)return;if(t.id==='q'){if(e.type==='input'){query=t.value;render()}return}
 if(ptUpdate(t))return;
 const k=t.dataset&&t.dataset.k;if(!k)return;const c=CALCS.find(x=>x.id===cur);if(!c)return;vals(c)[k]=t.type==='checkbox'?t.checked:t.value;if(t.type==='checkbox')t.parentElement.classList.toggle('on',t.checked);compute()}
['input','change','keyup'].forEach(ev=>document.addEventListener(ev,onField));
document.addEventListener('toggle',e=>{if(e.target.id==='pt')ptOpen=e.target.open},true);
document.addEventListener('click',e=>{if(e.target.id==='ptClear'){P=JSON.parse(JSON.stringify(EMPTY));isExample=false;ptOpen=true;save();render();const w=$('#p_w');if(w)w.focus();return}
 const g=e.target.closest('[data-go]');if(g){go(g.dataset.go);return}
 const tb=e.target.closest('[data-tab]');if(tb){tab=tb.dataset.tab;render();return}
 const a=e.target.closest('[data-act]');if(a&&curR){const before=cur;const fn=curR.act[+a.dataset.act].fn;fn();const c=CALCS.find(x=>x.id===cur);
  if(c&&cur===before){$('#inps').innerHTML=c.inp==='lb'?lbHtml(c,vals(c)):`<div class="grid2">${c.inp.map(i=>inputHtml(c,i,vals(c))).join('')}</div>`;compute()}}});
$('#btnBack').onclick=()=>{go(null)};
window.addEventListener('popstate',()=>{const h=location.hash.slice(1);const id=CALCS.find(x=>x.id===h)?h:null;if(id!==cur){cur=id;render()}});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);const id=CALCS.find(x=>x.id===h)?h:null;if(id!==cur){cur=id;render()}});
load();ptOpen=isExample||!Number.isFinite(num(P.w));{const h=location.hash.slice(1);if(CALCS.find(x=>x.id===h))cur=h}render();
window.PLYNY={F,CALCS,TESTS,runTests,runCalc,go};
</script>

</body></html>
